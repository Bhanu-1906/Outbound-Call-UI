<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreatWhite Call Agent</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      padding: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 24px;
      font-size: 28px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
      transform: none;
    }

    #result {
      margin-top: 20px;
      text-align: center;
      font-weight: 600;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>📞 GreatWhite Call Agent</h1>

  <div class="input-group">
    <label for="phoneNumber">Phone Number</label>
    <input
      type="tel"
      id="phoneNumber"
      placeholder="Enter 10-digit mobile number"
      maxlength="10"
    />
  </div>

  <button id="apiBtn">
    Initiate Call
  </button>

  <div id="result"></div>
</div>

<script>
  const button = document.getElementById("apiBtn");
  const result = document.getElementById("result");
  const phoneInput = document.getElementById("phoneNumber");

  button.addEventListener("click", async () => {
    const phone = phoneInput.value.trim();

    if (!/^\d{10}$/.test(phone)) {
      result.innerHTML =
        '<div class="error">Please enter a valid 10-digit mobile number.</div>';
      return;
    }

    button.disabled = true;
    button.textContent = "Calling...";
    result.innerHTML = "";

    try {
      const response = await fetch(
        "https://outbound-call-trigger.onrender.com/make-call",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            numbers: [phone],
            account_ids: ["string"]
          })
        }
      );

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      result.innerHTML =
        `<div class="success">✅ Call initiated successfully to ${phone}</div>`;
    } catch (error) {
      result.innerHTML =
        '<div class="error">❌ Failed to initiate call.</div>';
    } finally {
      button.disabled = false;
      button.textContent = "Initiate Call";
    }
  });
</script>

</body>
</html>
