<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSW Remote Order</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    h1 {
      color: #111827;
      margin-bottom: 24px;
      font-size: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 16px;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      width: 100%;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    #result {
      margin-top: 20px;
      font-weight: 500;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>JSW Remote Order</h1>

  <input
    type="tel"
    id="phoneNumber"
    placeholder="Enter mobile number"
    maxlength="10"
  />

  <button id="apiBtn">
    📞 Initiate Call
  </button>

  <div id="result"></div>
</div>

<script>
const button = document.getElementById("apiBtn");
const result = document.getElementById("result");
const phoneInput = document.getElementById("phoneNumber");

button.addEventListener("click", async () => {

  const phone = phoneInput.value.trim();

  // Basic validation
  if (!/^[0-9]{10}$/.test(phone)) {
    result.innerHTML =
      '<div class="error">❌ Please enter a valid 10-digit mobile number.</div>';
    return;
  }

  button.disabled = true;
  button.textContent = "Calling...";
  result.innerHTML = "";

  try {
    const response = await fetch(
      "https://outbound-call-trigger.onrender.com/make-call",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          numbers: [phone]
        })
      }
    );

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    result.innerHTML =
      `<div class="success">✅ Call initiated successfully for ${phone}</div>`;

  } catch (error) {
    result.innerHTML =
      `<div class="error">❌ Failed to initiate call</div>`;
  } finally {
    button.disabled = false;
    button.textContent = "📞 Initiate Call";
  }
});
</script>

</body>
</html>
