<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreatWhite Call Agent</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #fff;
            width: 400px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #111827;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>📞 GreatWhite Call Agent</h1>

    <label>Phone Number</label>

    <input
        id="phoneNumber"
        type="tel"
        placeholder="Enter 10-digit mobile number"
    >

    <button id="apiBtn">
        Initiate Call
    </button>

    <div id="result"></div>

</div>

<script>

const button = document.getElementById("apiBtn");
const phoneInput = document.getElementById("phoneNumber");
const result = document.getElementById("result");

button.addEventListener("click", async () => {

    const phone = phoneInput.value.trim();

    if(phone.length !== 10 || !/^\d+$/.test(phone)){
        result.innerHTML =
        '<div class="error">Enter a valid 10-digit mobile number.</div>';
        return;
    }

    button.disabled = true;
    button.textContent = "Calling...";
    result.innerHTML = "";

    try{

        const response = await fetch(
            "https://outbound-call-initiator.onrender.com/make-call",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },

                // FastAPI expects list[str]
                body: JSON.stringify([phone])
            }
        );

        const data = await response.json();

        if(!response.ok){
            throw new Error(data.detail || "Failed");
        }

        result.innerHTML = `
            <div class="success">
                ✅ ${data.status}<br><br>
                Calls Initiated : ${data.count}<br>
                Number : ${phone}
            </div>
        `;

    }
    catch(err){

        result.innerHTML = `
            <div class="error">
                ❌ ${err.message}
            </div>
        `;

    }
    finally{

        button.disabled = false;
        button.textContent = "Initiate Call";

    }

});

</script>

</body>
</html>
